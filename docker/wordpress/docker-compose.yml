services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: ${WORDPRESS_DB_PASSWORD:-wordpress}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20

  wordpress:
    image: wordpress:6.5-php8.2-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8090:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD:-wordpress}
      WORDPRESS_DEBUG: 1
    volumes:
      - wp_data:/var/www/html
      - ./wp-content/themes/heavy-haul-hub:/var/www/html/wp-content/themes/heavy-haul-hub
      - ./wp-content/mu-plugins:/var/www/html/wp-content/mu-plugins
      - ./plugins-manual:/var/www/html/wp-content/plugins-manual

  wpcli:
    image: wordpress:cli-2.10-php8.2
    depends_on:
      - wordpress
    user: www-data
    entrypoint: ["tail", "-f", "/dev/null"]
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD:-wordpress}
      WP_ADMIN_USER: ${WP_ADMIN_USER:-admin}
      WP_ADMIN_PASSWORD: ${WP_ADMIN_PASSWORD:-admin_password}
      WP_ADMIN_EMAIL: ${WP_ADMIN_EMAIL:-admin@example.com}
      WP_URL: http://localhost:8090
    volumes:
      - wp_data:/var/www/html
      - ./wp-content/themes/heavy-haul-hub:/var/www/html/wp-content/themes/heavy-haul-hub
      - ./wp-content/mu-plugins:/var/www/html/wp-content/mu-plugins
      - ./plugins-manual:/var/www/html/wp-content/plugins-manual
      - ./scripts:/scripts

volumes:
  db_data:
  wp_data:
